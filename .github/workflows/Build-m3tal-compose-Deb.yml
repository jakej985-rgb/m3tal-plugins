name: Build m3tal-compose DEB

on:
  push:
    branches:
      - main
    paths:
      - 'm3tal-compose/**'
  workflow_dispatch:
    inputs:
      force_bump:
        description: "Force version bump type (auto, patch, minor, major)"
        required: false
        default: "auto"

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Packaging Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends dpkg-dev apt-utils gnupg curl
          python3 -m pip install --upgrade pip pyyaml

      - name: Smart Auto-Bump m3tal-compose
        id: bump
        run: |
          FORCE_BUMP="${{ github.event.inputs.force_bump || 'auto' }}"
          BASE_REF="${{ github.event.before }}"
          [ -z "$BASE_REF" ] || [ "$BASE_REF" = "0000000000000000000000000000000000000000" ] && BASE_REF="HEAD~1"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual workflow dispatch for m3tal-compose..."
            ./scripts/smart-bump.py --plugin "m3tal-compose" --bump-type "$FORCE_BUMP" --apply --force
          else
            echo "Evaluating change detection from base $BASE_REF..."
            ./scripts/smart-bump.py --base "$BASE_REF" --plugin "m3tal-compose" --apply
          fi

          VERSION=$(grep 'version:' m3tal-compose/plugin.yaml | head -n1 | awk '{print $2}' | tr -d '"')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if [ -n "$(git status --porcelain m3tal-compose/)" ]; then
            git config user.name "m3tal-bot"
            git config user.email "bot@m3tal.io"
            git add m3tal-compose/
            git commit -m "chore(release): auto-bump m3tal-compose version and update CHANGELOG [skip ci]"
            git push origin main
          fi

      - name: Build and Package m3tal-compose DEB
        id: package
        run: |
          ./scripts/build-plugin-deb.sh "m3tal-compose"
          DEB_FILE=$(ls m3tal-plugin-compose_*.deb | head -n1)
          SHA_FILE="${DEB_FILE}.sha256"
          echo "deb_file=$DEB_FILE" >> "$GITHUB_OUTPUT"
          echo "sha_file=$SHA_FILE" >> "$GITHUB_OUTPUT"

      - name: Create / Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: plugins-latest
          name: "M3TAL Plugins Release"
          draft: false
          prerelease: false
          files: |
            ${{ steps.package.outputs.deb_file }}
            ${{ steps.package.outputs.sha_file }}
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Ingest & Sign DEB via Central APT Repository (m3tal-apt-key)
        run: |
          VERSION="${{ steps.bump.outputs.version }}"
          DEB_FILE="${{ steps.package.outputs.deb_file }}"
          DEB_URL="https://github.com/jakej985-rgb/m3tal-plugins/releases/download/plugins-latest/${DEB_FILE}"

          echo "Dispatching deb ingestion event to jakej985-rgb/m3tal-apt-key..."
          curl -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/jakej985-rgb/m3tal-apt-key/dispatches \
            -d '{
              "event_type": "publish-deb",
              "client_payload": {
                "package_id": "m3tal-plugin-compose",
                "version": "'"$VERSION"'",
                "deb_url": "'"$DEB_URL"'",
                "allow_replace": true
              }
            }'
