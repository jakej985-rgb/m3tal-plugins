version: 2
updates:
  # Workflow action refs are pinned to full commit SHAs with the release tag in
  # a trailing comment (`actions/checkout@3d3c42e… # v7.0.1`) so a re-pointed or
  # compromised tag cannot change what runs. Dependabot understands that form
  # and updates the SHA and the comment together, so pinning does not mean
  # going stale.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    # One PR per week for all action bumps; each would otherwise arrive
    # separately and need its own CI run.
    groups:
      github-actions:
        patterns:
          - "*"
