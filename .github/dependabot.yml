version: 2
updates:
  # Action refs are SHA-pinned with the release tag in a trailing comment
  # (`actions/checkout@3d3c42e… # v7.0.1`); Dependabot updates both together.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    # One PR per week for all action bumps; each would otherwise arrive
    # separately and need its own CI run.
    groups:
      github-actions:
        patterns:
          - "*"
