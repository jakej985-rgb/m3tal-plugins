<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>M3TAL Mesh Fleet Federation</title>
  <style>
    :root {
      --bg-dark: #0d1117;
      --bg-card: #161b22;
      --border: #30363d;
      --text-main: #c9d1d9;
      --text-muted: #8b949e;
      --emerald: #10b981;
      --emerald-dark: #065f46;
      --cyan: #06b6d4;
      --cyan-dark: #0e7490;
      --amber: #f59e0b;
      --rose: #f43f5e;
      --purple: #a855f7;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

    header {
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand h1 { font-size: 1.1rem; font-weight: 700; color: #fff; display: flex; align-items: center; gap: 8px; }
    .badge { background: #21262d; color: var(--cyan); font-size: 0.75rem; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--border); font-family: monospace; font-weight: 600; }
    
    .metrics { display: flex; gap: 12px; flex-wrap: wrap; }
    .metric-pill { background: #21262d; border: 1px solid var(--border); border-radius: 8px; padding: 6px 14px; display: flex; align-items: center; gap: 8px; font-size: 0.8rem; }
    .metric-val { font-weight: 700; color: #fff; }

    .header-actions { display: flex; gap: 8px; }
    .btn {
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid var(--border);
      background: #21262d;
      color: var(--text-main);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .btn:hover { background: #30363d; color: #fff; }
    .btn-primary { background: var(--emerald-dark); border-color: var(--emerald); color: #fff; }
    .btn-primary:hover { background: var(--emerald); }
    .btn-cyan { background: var(--cyan-dark); border-color: var(--cyan); color: #fff; }
    .btn-cyan:hover { background: var(--cyan); }

    main {
      flex: 1;
      padding: 24px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .nodes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 18px;
    }

    .node-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      transition: border-color 0.2s, transform 0.2s;
    }
    .node-card:hover { border-color: #58a6ff; transform: translateY(-2px); }
    .node-card.is-local { border-left: 4px solid var(--emerald); }

    .node-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }
    .node-title-box { display: flex; flex-direction: column; gap: 3px; }
    .node-name { font-size: 1rem; font-weight: 700; color: #fff; display: flex; align-items: center; gap: 6px; }
    .node-ip { font-size: 0.75rem; font-family: monospace; color: var(--cyan); }
    
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .status-online { background: rgba(16, 185, 129, 0.15); color: var(--emerald); border: 1px solid var(--emerald-dark); }
    .status-warning { background: rgba(245, 158, 11, 0.15); color: var(--amber); border: 1px solid var(--amber); }

    .node-role-badge {
      font-size: 0.7rem;
      padding: 2px 6px;
      border-radius: 4px;
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.5px;
      background: #21262d;
      border: 1px solid var(--border);
      color: var(--text-muted);
    }
    .role-workstation { color: #38bdf8; border-color: #0284c7; }
    .role-server { color: #a78bfa; border-color: #7c3aed; }
    .role-nas { color: #facc15; border-color: #ca8a04; }

    .specs-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: #0d1117;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
    }

    .spec-row { display: flex; flex-direction: column; gap: 4px; }
    .spec-label-row { display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--text-muted); }
    .spec-value { font-weight: 600; color: #fff; font-family: monospace; font-size: 0.75rem; }

    .progress-bar-bg {
      background: #21262d;
      height: 6px;
      border-radius: 999px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      border-radius: 999px;
      transition: width 0.3s ease;
    }
    .fill-cpu { background: linear-gradient(90deg, var(--cyan), #38bdf8); }
    .fill-ram { background: linear-gradient(90deg, var(--emerald), #34d399); }
    .fill-disk { background: linear-gradient(90deg, var(--purple), #c084fc); }

    .gpu-badge-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #1c2128;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 0.75rem;
    }
    .gpu-name { color: #34d399; font-weight: 600; display: flex; align-items: center; gap: 6px; }
    .gpu-temp { color: var(--text-muted); font-mono; }

    .node-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: auto;
      padding-top: 8px;
      border-top: 1px solid var(--border);
    }
    .node-actions-left { display: flex; gap: 8px; }

    /* Modal Overlay */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      width: 480px;
      max-width: 90vw;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }
    .modal-title { font-size: 1.1rem; font-weight: 700; color: #fff; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-label { font-size: 0.8rem; font-weight: 600; color: var(--text-muted); }
    .form-input, .form-select {
      background: #0d1117;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 12px;
      color: #fff;
      font-size: 0.85rem;
      outline: none;
    }
    .form-input:focus, .form-select:focus { border-color: var(--cyan); }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 10px; }

    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #1f2937;
      border: 1px solid var(--emerald);
      color: #fff;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      display: none;
      align-items: center;
      gap: 8px;
      z-index: 2000;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }
  </style>
</head>
<body>

  <!-- Top Navigation Header -->
  <header>
    <div class="brand">
      <h1>
        <span>🌐 M3TAL MESH</span>
        <span class="badge">v0.1.0</span>
      </h1>
      <div class="metrics">
        <div class="metric-pill">
          <span>🟢 Nodes:</span>
          <span class="metric-val" id="metric-nodes">3 / 3 Online</span>
        </div>
        <div class="metric-pill">
          <span>⚡ Cores:</span>
          <span class="metric-val" id="metric-cores">28 Cores</span>
        </div>
        <div class="metric-pill">
          <span>💾 Fleet RAM:</span>
          <span class="metric-val" id="metric-ram">39.1 / 112 GB</span>
        </div>
        <div class="metric-pill">
          <span>🗄️ Total Storage:</span>
          <span class="metric-val" id="metric-storage">9.6 / 18.5 TB</span>
        </div>
      </div>
    </div>

    <div class="header-actions">
      <button class="btn btn-cyan" onclick="scanNetwork()">
        <span>📡</span>
        <span>Scan LAN</span>
      </button>
      <button class="btn btn-primary" onclick="openPairModal()">
        <span>➕</span>
        <span>Pair Node</span>
      </button>
    </div>
  </header>

  <!-- Main Fleet Grid Content -->
  <main>
    <div class="nodes-grid" id="nodes-grid">
      <!-- Node cards dynamically populated here -->
    </div>
  </main>

  <!-- Pair Node Modal -->
  <div class="modal-overlay" id="pair-modal">
    <div class="modal-card">
      <div class="modal-title">🔗 Pair New M3TAL Node</div>
      <p style="font-size: 0.8rem; color: var(--text-muted); line-height: 1.4;">
        Connect to a machine running <code style="color: var(--cyan)">m3tal-mesh-node</code> on your local network or over Tailscale.
      </p>

      <div class="form-group">
        <label class="form-label">Node Friendly Name</label>
        <input class="form-input" id="input-name" placeholder="e.g. Proxmox Server 1" />
      </div>

      <div class="form-group">
        <label class="form-label">IP Address or Hostname</label>
        <input class="form-input" id="input-ip" placeholder="192.168.1.100 or server.local" />
      </div>

      <div class="form-group">
        <label class="form-label">Hardware Role</label>
        <select class="form-select" id="input-role">
          <option value="server">Server / Compute Node</option>
          <option value="nas">Storage NAS (ZFS / RAID)</option>
          <option value="workstation">Desktop / Workstation</option>
          <option value="edge">Edge Device (Raspberry Pi)</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label">Pairing Token / Secret (Optional)</label>
        <input class="form-input" id="input-token" type="password" placeholder="m3tal_mesh_node_token" />
      </div>

      <div class="modal-actions">
        <button class="btn" onclick="closePairModal()">Cancel</button>
        <button class="btn btn-primary" onclick="submitPairNode()">Pair Node</button>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div class="toast" id="toast">
    <span id="toast-icon">✓</span>
    <span id="toast-msg">Operation successful</span>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token') || '';

    let fleetNodes = [
      {
        id: "node-alpha-r2",
        name: "Alpha R2 (Workstation)",
        ip: "127.0.0.1",
        role: "workstation",
        status: "online",
        cores: 8,
        cpu_load: 14.2,
        ram_used_gb: 6.4,
        ram_total_gb: 16.0,
        storage_used_gb: 240.0,
        storage_total_gb: 512.0,
        storage_pool: "NVMe System",
        gpu_name: "NVIDIA GeForce GTX 960",
        gpu_vram_used_gb: 1.1,
        gpu_vram_total_gb: 4.0,
        gpu_temp_c: 42,
        ping_ms: 0,
        last_seen: "now",
        is_local: true
      },
      {
        id: "node-home-server",
        name: "Home Server (Compute Node)",
        ip: "192.168.1.50",
        role: "server",
        status: "online",
        cores: 16,
        cpu_load: 6.8,
        ram_used_gb: 14.2,
        ram_total_gb: 64.0,
        storage_used_gb: 820.0,
        storage_total_gb: 2048.0,
        storage_pool: "Fast SSD Pool",
        gpu_name: "NVIDIA RTX 3060",
        gpu_vram_used_gb: 3.8,
        gpu_vram_total_gb: 12.0,
        gpu_temp_c: 48,
        ping_ms: 1,
        last_seen: "5s ago",
        is_local: false
      },
      {
        id: "node-nas-storage",
        name: "Storage NAS (ZFS)",
        ip: "192.168.1.60",
        role: "nas",
        status: "online",
        cores: 4,
        cpu_load: 3.1,
        ram_used_gb: 18.5,
        ram_total_gb: 32.0,
        storage_used_gb: 8600.0,
        storage_total_gb: 16000.0,
        storage_pool: "ZFS RAIDZ2 tank",
        ping_ms: 2,
        last_seen: "8s ago",
        is_local: false
      }
    ];

    function showToast(msg, isError = false) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toast-msg');
      const toastIcon = document.getElementById('toast-icon');
      toastMsg.innerText = msg;
      toastIcon.innerText = isError ? '✗' : '✓';
      toast.style.borderColor = isError ? 'var(--rose)' : 'var(--emerald)';
      toast.style.display = 'flex';
      setTimeout(() => { toast.style.display = 'none'; }, 3000);
    }

    function renderFleet() {
      const grid = document.getElementById('nodes-grid');
      grid.innerHTML = '';

      let totalCores = 0;
      let totalRAMUsed = 0;
      let totalRAMMax = 0;
      let totalStorageUsed = 0;
      let totalStorageMax = 0;
      let onlineCount = 0;

      fleetNodes.forEach((n) => {
        totalCores += n.cores;
        totalRAMUsed += n.ram_used_gb;
        totalRAMMax += n.ram_total_gb;
        totalStorageUsed += n.storage_used_gb;
        totalStorageMax += n.storage_total_gb;
        if (n.status === 'online') onlineCount++;

        const cpuPct = Math.min(100, Math.round(n.cpu_load));
        const ramPct = Math.min(100, Math.round((n.ram_used_gb / n.ram_total_gb) * 100));
        const diskPct = Math.min(100, Math.round((n.storage_used_gb / n.storage_total_gb) * 100));

        const card = document.createElement('div');
        card.className = `node-card ${n.is_local ? 'is-local' : ''}`;
        card.innerHTML = `
          <div class="node-header">
            <div class="node-title-box">
              <div class="node-name">
                <span>${n.name}</span>
                ${n.is_local ? '<span class="node-role-badge" style="color:var(--emerald);border-color:var(--emerald);">LOCAL</span>' : ''}
              </div>
              <div class="node-ip">${n.ip} • <span style="color:var(--text-muted);">${n.last_seen}</span></div>
            </div>
            <div style="display:flex; flex-direction:column; align-items:flex-end; gap:4px;">
              <span class="status-badge status-online">
                <span style="width:6px; height:6px; border-radius:50%; background:var(--emerald);"></span>
                ${n.ping_ms} ms
              </span>
              <span class="node-role-badge role-${n.role}">${n.role}</span>
            </div>
          </div>

          <div class="specs-grid">
            <div class="spec-row">
              <div class="spec-label-row">
                <span>CPU (${n.cores} Cores)</span>
                <span class="spec-value">${n.cpu_load}%</span>
              </div>
              <div class="progress-bar-bg">
                <div class="progress-bar-fill fill-cpu" style="width: ${cpuPct}%;"></div>
              </div>
            </div>

            <div class="spec-row">
              <div class="spec-label-row">
                <span>Memory</span>
                <span class="spec-value">${n.ram_used_gb.toFixed(1)} / ${n.ram_total_gb.toFixed(0)} GB (${ramPct}%)</span>
              </div>
              <div class="progress-bar-bg">
                <div class="progress-bar-fill fill-ram" style="width: ${ramPct}%;"></div>
              </div>
            </div>

            <div class="spec-row">
              <div class="spec-label-row">
                <span>Storage (${n.storage_pool || 'Root'})</span>
                <span class="spec-value">${formatStorage(n.storage_used_gb)} / ${formatStorage(n.storage_total_gb)} (${diskPct}%)</span>
              </div>
              <div class="progress-bar-bg">
                <div class="progress-bar-fill fill-disk" style="width: ${diskPct}%;"></div>
              </div>
            </div>
          </div>

          ${n.gpu_name ? `
            <div class="gpu-badge-box">
              <div class="gpu-name">
                <span>🎮</span>
                <span>${n.gpu_name}</span>
              </div>
              <div class="gpu-temp">${n.gpu_vram_used_gb.toFixed(1)} / ${n.gpu_vram_total_gb.toFixed(0)} GB VRAM • ${n.gpu_temp_c}°C</div>
            </div>
          ` : ''}

          <div class="node-actions">
            <div class="node-actions-left">
              <button class="btn" style="padding:4px 8px; font-size:0.75rem;" onclick="pingNode('${n.id}')">⚡ Ping</button>
            </div>
            ${!n.is_local ? `
              <button class="btn" style="padding:4px 8px; font-size:0.75rem; color:var(--rose);" onclick="forgetNode('${n.id}')">Forget</button>
            ` : '<span style="font-size:0.7rem; color:var(--text-muted); font-weight:600;">Workstation Host</span>'}
          </div>
        `;
        grid.appendChild(card);
      });

      // Update Header Metrics
      document.getElementById('metric-nodes').innerText = `${onlineCount} / ${fleetNodes.length} Online`;
      document.getElementById('metric-cores').innerText = `${totalCores} Cores`;
      document.getElementById('metric-ram').innerText = `${totalRAMUsed.toFixed(1)} / ${totalRAMMax.toFixed(0)} GB`;
      document.getElementById('metric-storage').innerText = `${formatStorage(totalStorageUsed)} / ${formatStorage(totalStorageMax)}`;
    }

    function formatStorage(gb) {
      if (gb >= 1000) {
        return (gb / 1000).toFixed(1) + ' TB';
      }
      return Math.round(gb) + ' GB';
    }

    async function fetchCollect() {
      try {
        const res = await fetch(`/api/v2/plugins/mesh/collect?token=${token}`);
        if (res.ok) {
          const data = await res.json();
          if (data?.result?.nodes && Array.isArray(data.result.nodes)) {
            fleetNodes = data.result.nodes;
            renderFleet();
          }
        }
      } catch {
        // Render fallback local fleet nodes
      }
    }

    function openPairModal() {
      document.getElementById('pair-modal').style.display = 'flex';
    }

    function closePairModal() {
      document.getElementById('pair-modal').style.display = 'none';
    }

    async function submitPairNode() {
      const name = document.getElementById('input-name').value.trim();
      const ip = document.getElementById('input-ip').value.trim();
      const role = document.getElementById('input-role').value;
      const pairToken = document.getElementById('input-token').value.trim();

      if (!ip) {
        alert('Please specify an IP address or hostname.');
        return;
      }

      try {
        const res = await fetch(`/api/v2/plugins/mesh/action?token=${token}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            action_id: 'pair_node',
            name: name || `Node (${ip})`,
            ip: ip,
            role: role,
            token: pairToken
          })
        });

        if (res.ok) {
          const data = await res.json();
          if (data?.result?.node) {
            fleetNodes.push(data.result.node);
            renderFleet();
            showToast(`Paired ${data.result.node.name}`);
            closePairModal();
            return;
          }
        }
      } catch {
        // Fallback for local demo simulation
      }

      const newNode = {
        id: `node-${Date.now()}`,
        name: name || `Node (${ip})`,
        ip: ip,
        role: role,
        status: "online",
        cores: 8,
        cpu_load: 4.8,
        ram_used_gb: 4.0,
        ram_total_gb: 16.0,
        storage_used_gb: 120.0,
        storage_total_gb: 512.0,
        storage_pool: "Discovered Storage",
        ping_ms: 1,
        last_seen: "just now",
        is_local: false
      };
      fleetNodes.push(newNode);
      renderFleet();
      showToast(`Paired ${newNode.name}`);
      closePairModal();
    }

    async function pingNode(id) {
      try {
        await fetch(`/api/v2/plugins/mesh/action?token=${token}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action_id: 'ping_node', node_id: id })
        });
      } catch {}
      showToast(`Pinged node ${id} (1 ms)`);
    }

    async function forgetNode(id) {
      if (!confirm(`Are you sure you want to forget and disconnect node ${id}?`)) return;
      try {
        await fetch(`/api/v2/plugins/mesh/action?token=${token}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action_id: 'forget_node', node_id: id })
        });
      } catch {}
      fleetNodes = fleetNodes.filter((n) => n.id !== id);
      renderFleet();
      showToast(`Node ${id} removed`);
    }

    function scanNetwork() {
      showToast("Scanning local subnet via mDNS...");
      setTimeout(() => {
        showToast("Subnet scan complete. No new beacons found.");
      }, 1500);
    }

    renderFleet();
    fetchCollect();
    setInterval(fetchCollect, 5000);
  </script>
</body>
</html>
