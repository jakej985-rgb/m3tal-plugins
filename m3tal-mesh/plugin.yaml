apiVersion: m3tal.io/v1alpha1
kind: Plugin
metadata:
  name: mesh
  version: "0.7.1"
  title: "Mesh Fleet"
  description: "Personal Cloud & Local Network Fleet Federation, peer discovery, and multi-node hardware telemetry reader"
  author: "jakej985-rgb"
  license: "MIT"
  icon: "IconServer"
  package_name: "m3tal-plugin-mesh"

spec:
  command: "./bin/m3tal-mesh"
  args: []
  process_name: "m3tal-mesh"
  poll_interval: 3s

  capabilities:
    - collector
    - actions
    - ui_view
    - settings

  settings:
    - id: "mesh_settings"
      title: "Mesh Fleet Federation"
      description: "Mesh cluster federation, remote node discovery, and authentication (uses M3TAL Core API key)"
      category: "network"
      fields:
        - key: "pairing_token"
          label: "Cluster Pairing Token (Optional Override)"
          type: "password"
          default: ""
          description: "Optional manual override token. By default, Mesh authenticates using M3TAL Core API keys."
        - key: "default_password"
          label: "Connection Password (Optional)"
          type: "password"
          default: ""
          description: "Optional fallback password sent to remote nodes that require password verification"
        - key: "require_pairing_token"
          label: "Require Authentication"
          type: "boolean"
          default: true
          description: "Enforce credentials authentication for all remote nodes. Disabling this allows connecting to unauthenticated nodes (⚠️ SAFETY WARNING: Not recommended or safe on untrusted/shared networks!)."
        - key: "listen_port"
          label: "Telemetry & Broadcaster Port"
          type: "number"
          default: 9321
          description: "TCP port used for direct peer telemetry broadcasting and connections"
        - key: "discovery_enabled"
          label: "Enable LAN Discovery (mDNS)"
          type: "boolean"
          default: true
          description: "Automatically discover and broadcast presence to local M3TAL mesh instances on LAN"
        - key: "broadcast_mdns"
          label: "Broadcast Presence (mDNS)"
          type: "boolean"
          default: true
          description: "Announce this node's presence on the local subnet via mDNS"
        - key: "broadcaster_only_mode"
          label: "Broadcaster Only Mode"
          type: "boolean"
          default: false
          description: "Run in lightweight broadcaster-only mode without outbound fleet polling"

  ui:
    entry: "ui/dist/index.html"
    route: "/mesh"
    category: "fleet"
    category_title: "Mesh Fleet"
    tab_id: "mesh_fleet"
    title: "Mesh Fleet"
    sidebar: true
    order: 30
    roles: ["admin"]

  rpc:
    protocol: "jsonrpc-2.0"
    transport: "stdio"

  requirements:
    binaries: []
    root: false
