apiVersion: m3tal.io/v1alpha1
kind: Plugin
metadata:
  name: mesh
  version: "0.3.0"
  title: "Mesh Fleet"
  description: "Personal Cloud & Local Network Fleet Federation, peer discovery, and multi-node hardware telemetry reader"
  author: "jakej985-rgb"
  license: "MIT"
  icon: "IconServer"
  package_name: "m3tal-plugin-mesh"

spec:
  command: "./bin/m3tal-mesh"
  args: []
  process_name: "m3tal-mesh"
  poll_interval: 3s

  capabilities:
    - collector
    - actions
    - ui_view
    - settings

  settings:
    - id: "mesh_settings"
      title: "Mesh Fleet Federation"
      description: "Mesh cluster federation, remote node discovery, and authentication (uses M3TAL Core API key)"
      fields:
        - key: "default_password"
          label: "Default Connection Password (Optional)"
          type: "password"
          default: ""
          description: "Optional fallback password sent to remote nodes that require password verification"
        - key: "require_pairing_token"
          label: "Require Authentication"
          type: "boolean"
          default: true
          description: "Enforce credentials authentication for all remote nodes. Disabling this allows connecting to unauthenticated nodes (⚠️ SAFETY WARNING: Not recommended or safe on untrusted/shared networks!)."
        - key: "listen_port"
          label: "Default Node Port"
          type: "number"
          default: 9321
          description: "Default TCP port for communicating with remote m3tal-mesh-node instances"
        - key: "discovery_enabled"
          label: "Enable LAN Discovery (mDNS)"
          type: "boolean"
          default: true
          description: "Automatically discover local m3tal-mesh-node daemons via mDNS on local subnet"

  ui:
    entry: "ui/dist/index.html"
    route: "/mesh"
    category: "fleet"
    category_title: "Mesh Fleet"
    tab_id: "mesh_fleet"
    title: "Mesh Fleet"
    sidebar: true
    order: 30
    roles: ["admin"]

  rpc:
    protocol: "jsonrpc-2.0"
    transport: "stdio"

  requirements:
    binaries: []
    root: false
