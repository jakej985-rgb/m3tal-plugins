apiVersion: m3tal.io/v1alpha1
kind: Plugin
metadata:
  name: mesh-node
  version: "0.1.5"
  title: "Mesh Node (Telemetry Sender)"
  description: "Headless M3TAL telemetry broadcaster and node metrics daemon for personal cloud clustering"
  author: "jakej985-rgb"
  license: "MIT"
  icon: "IconServer"
  package_name: "m3tal-plugin-mesh-node"

spec:
  command: "./bin/m3tal-mesh-node"
  args: []
  process_name: "m3tal-mesh-node"
  poll_interval: 2s

  capabilities:
    - collector
    - actions
    - ui_view
    - settings

  settings:
    - id: "mesh_node_settings"
      title: "Mesh Node Broadcaster"
      description: "Mesh Node telemetry sender, authentication token, and discovery settings"
      fields:
        - key: "pairing_token"
          label: "Pairing Token / Shared Secret"
          type: "password"
          default: ""
          description: "Shared secret required for remote mesh federation readers to pull telemetry"
        - key: "require_pairing_token"
          label: "Require Pairing Token / Secret"
          type: "boolean"
          default: true
          description: "Enforce authentication token before serving telemetry. Disabling makes pairing token optional (⚠️ SAFETY WARNING: Not recommended or safe on untrusted/shared networks!)."
        - key: "listen_port"
          label: "Telemetry Port"
          type: "number"
          default: 9321
          description: "Port used for direct peer telemetry connections"
        - key: "broadcast_mdns"
          label: "LAN Discovery (mDNS)"
          type: "boolean"
          default: true
          description: "Announce node presence on local subnet via mDNS"

  ui:
    entry: "ui/dist/index.html"
    route: "/mesh-node"
    category: "fleet"
    category_title: "Mesh Fleet"
    tab_id: "mesh_node_settings"
    title: "Mesh Node Settings"
    sidebar: true
    order: 31
    roles: ["admin"]

  rpc:
    protocol: "jsonrpc-2.0"
    transport: "stdio"

  requirements:
    binaries: []
    root: false
