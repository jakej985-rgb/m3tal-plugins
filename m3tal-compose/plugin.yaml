apiVersion: m3tal.io/v1alpha1
kind: Plugin
metadata:
  name: compose
  version: "0.4.0"
  package_name: "m3tal-plugin-compose"
  title: "Compose"
  description: "Docker Compose visual editor, syntax validator, and stack lifecycle manager"
  author: "jakej985-rgb"
  license: "MIT"
  icon: "IconLayers"

spec:
  command: "./bin/m3tal-compose"
  args: []
  process_name: "m3tal-compose"
  poll_interval: 5s

  capabilities:
    - collector
    - actions
    - ui_view
    - settings

  ui:
    entry: "ui/dist/index.html"
    route: "/containers"
    category: "containers"
    category_title: "Containers"
    tab_id: "compose_editor"
    title: "Compose"
    sidebar: true
    order: 25
    roles: ["admin", "viewer"]

  settings:
    - id: "compose_settings"
      title: "Compose Projects"
      description: "Project discovery and new stack storage settings"
      fields:
        - key: "compose_dir"
          label: "Search folder"
          type: "text"
          default: "~/docker"
          description: "Recursively search for Compose projects in this folder."
        - key: "new_stack_layout"
          label: "New stack layout"
          type: "select"
          default: "per_stack_folder"
          options: ["per_stack_folder", "flat"]
          description: "Choose how new stack files are arranged under the search folder."
        - key: "backup_on_save"
          label: "Back up before saving"
          type: "boolean"
          default: true
          description: "Keep a .bak copy when replacing an existing Compose file."

  rpc:
    protocol: "jsonrpc-2.0"
    transport: "stdio"

  requirements:
    binaries:
      - docker
    root: false
