apiVersion: m3tal.io/v1alpha1
kind: Plugin
metadata:
  name: compose
  version: "0.3.0"
  package_name: "m3tal-plugin-compose"
  title: "Compose"
  description: "Docker Compose visual editor, syntax validator, and stack lifecycle manager"
  author: "jakej985-rgb"
  license: "MIT"
  icon: "IconLayers"

spec:
  command: "./bin/m3tal-compose"
  args: []
  process_name: "m3tal-compose"
  poll_interval: 5s

  capabilities:
    - collector
    - actions
    - ui_view

  ui:
    entry: "ui/dist/index.html"
    route: "/containers"
    category: "containers"
    category_title: "Containers"
    tab_id: "compose_editor"
    title: "Compose"
    sidebar: true
    order: 25
    roles: ["admin", "viewer"]

  rpc:
    protocol: "jsonrpc-2.0"
    transport: "stdio"

  requirements:
    binaries:
      - docker
    root: false
